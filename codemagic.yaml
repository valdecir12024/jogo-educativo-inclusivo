# Arquivo de configuração de automação do Codemagic com publicação Web
workflows:
  web-and-android-build:
    name: Compilação Web e Android Jogo Inclusivo
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Buscar dependências do projeto
        script: |
          flutter pub get
      - name: Compilar versão Web do Jogo
        script: |
          flutter build web --release --base-href "/jogo-educativo-inclusivo/"
      - name: Compilar arquivo de instalação do Android (APK)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**
    publishing:
      github_pages:
        repo: valdecir12024/jogo-educativo-inclusivo
        branch: gh-pages # O Codemagic vai criar essa ramificação nova só para os arquivos do site!
